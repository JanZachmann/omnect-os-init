[package]
name = "omnect-os-init"
version = "0.1.0"
edition = "2024"
authors = ["omnect team"]
description = "Rust-based init process for omnect-os initramfs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omnect/omnect-os-init"

[lib]
name = "omnect_os_init"
path = "src/lib.rs"

[[bin]]
name = "omnect-os-init"
path = "src/main.rs"

[dependencies]
hex = { version = "0.4", default-features = false, optional = true }
log = { version = "0.4", default-features = false, features = ["std"] }
# TODO: remove me, as soon as lzma-rust2 1.0 is released: until then a 0.x
# update can change the decoder that runs in PID 1, so it needs a review.
lzma-rust2 = { version = "=0.21.0", default-features = false, features = ["std", "xz"], optional = true }
nix = { version = "0.29", default-features = false, features = ["fs", "ioctl", "mount", "net", "process", "reboot", "user"] }
quick-xml = { version = "0.42", default-features = false, features = ["serialize"], optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false, optional = true }
thiserror = { version = "2.0", default-features = false }
uuid = { version = "1.11", default-features = false, optional = true }

[features]
default = ["core", "flash-mode-1"]
core = []
dos = ["core"]            # DOS/MBR partition table (extended container at slot 4, logical partitions 5-8)
factory-reset = ["core"]
flash-mode = ["core"]     # Shared flash layer; pulled in by a mode, never selected on its own
flash-mode-1 = ["flash-mode", "dep:uuid"]  # Clone the running disk onto another block device
flash-mode-2 = ["flash-mode", "dep:hex", "dep:lzma-rust2", "dep:quick-xml", "dep:sha2"] # Flash a wic.xz pushed in over scp
flash-mode-2-direct = ["flash-mode-2"] # Flash straight from the scp stream, no verify pass
gpt = ["core"]            # GPT partition table (primary partitions 1-7)
grub = ["core"]           # x86-64 EFI targets (GRUB bootloader)
persistent-var-log = ["core"]
release-image = ["core"]  # Enables release-mode error handling (loop on fatal error)
resize-data = ["core"]    # Expands data partition to fill disk on first boot
test-utils = []
uboot = ["core"]          # ARM targets (U-Boot bootloader)

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
strip = true           # Strip symbols
panic = "abort"        # Smaller panic handling

[[test]]
name = "degraded_boot"
required-features = ["test-utils"]

[[test]]
name = "factory_reset"
required-features = ["factory-reset", "test-utils"]

[[test]]
name = "flash_modes"
required-features = ["test-utils", "flash-mode"]

[dev-dependencies]
hex = { version = "0.4", default-features = false, features = ["alloc"] }
lzma-rust2 = { version = "=0.21.0", default-features = false, features = ["encoder", "std", "xz"] }
tempfile = { version = "3.20", default-features = false }

[package]
name = "omnect-os-init"
version = "0.1.0"
edition = "2024"
authors = ["omnect team"]
description = "Rust-based init process for omnect-os initramfs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omnect/omnect-os-init"

[lib]
name = "omnect_os_init"
path = "src/lib.rs"

[[bin]]
name = "omnect-os-init"
path = "src/main.rs"

[dependencies]
log = { version = "0.4", default-features = false, features = ["std"] }
nix = { version = "0.29", default-features = false, features = ["fs", "ioctl", "mount", "process", "reboot", "user"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false }

[features]
default = ["core"]
core = []
dos = ["core"]            # DOS/MBR partition table (extended container at slot 4, logical partitions 5-8)
factory-reset = ["core"]
gpt = ["core"]            # GPT partition table (primary partitions 1-7)
grub = ["core"]           # x86-64 EFI targets (GRUB bootloader)
persistent-var-log = ["core"]
release-image = ["core"]  # Enables release-mode error handling (loop on fatal error)
resize-data = ["core"]    # Expands data partition to fill disk on first boot
test-utils = []
uboot = ["core"]          # ARM targets (U-Boot bootloader)

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
strip = true           # Strip symbols
panic = "abort"        # Smaller panic handling

[[test]]
name = "degraded_boot"
required-features = ["test-utils"]

[dev-dependencies]
tempfile = { version = "3.20", default-features = false }
